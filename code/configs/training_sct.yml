data:
  name: pl
  path: ./data/crossdocked_v1.1_rmsd1.0_pocket10
  split: data/crossdocked_pocket10_pose_split.pt
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: False
  test_path: ./data/test_set

model:
  diffusion_type: veda
  model_mean_type: C0
  beta_schedule: sigmoid

  sigma_data: 1
  sigma_min: 0.0003
  sigma_max: 80
  rho: 2.0
  edm_p_mean: -1.86
  edm_p_std: 1.56

  discrete_prior: uniform
  dfm_beta: 2
  dfm_type: campbell
  mask_mode: uniform
  beta_start: 1.e-7
  beta_end: 2.e-3
  v_beta_schedule: cosine
  v_beta_s: 0.01
  num_diffusion_timesteps: 100
  loss_pos_weight: 3.0
  loss_v_weight: 0.3
  bond_loss: false
  bond_input: false
  use_bond_edge_feats: false
  sample_bond: false
  loss_bond_weight: 0.1
  loss_non_bond_weight: 0.01

  # Experiment configuration: enable the final shared log-sigma sCT branches.
  use_sct_coordinate_consistency: true
  sct_coord_loss_weight: 1.0
  sct_coord_probe_step: 0.1
  sct_time_parameterization: log  # linear | log; log means log-sigma
  sct_tangent_norm_mode: scale-c  # fixed-c | scale-c | no-norm
  sct_tangent_norm_constant: 0.1
  sct_tangent_warmup_steps: 2000
  discrete_consistency_mode: logit_sct
  sct_discrete_probe_step: 0.1
  sct_discrete_tangent_norm_constant: 0.1
  sct_discrete_tangent_warmup_steps: 2000
  sct_atom_loss_weight: null
  sct_bond_loss_weight: null

  sample_time_method: symmetric
  time_emb_dim: 64
  time_emb_mode: sin
  time_scheduler: log_uniform
  center_pos_mode: protein
  rescale_factor: 0.2
  veda_x_pred_mode: constant

  node_indicator: True
  model_type: uni_o2
  num_blocks: 1
  num_layers: 9
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 4
  num_r_gaussian: 20
  knn: 32
  num_node_types: 8
  act_fn: relu
  norm: True
  cutoff_mode: knn
  ew_net_type: global
  num_x2h: 1
  num_h2x: 1
  r_max: 10.
  x2h_out_fc: False
  sync_twoup: False

train:
  seed: 2021
  batch_size: 4
  num_workers: 4
  n_acc_batch: 1
  max_iters: 400000
  val_freq: 2000
  quick_eval_freq: 10000
  quick_eval_num_proteins: 10
  quick_eval_num_ligands_per_protein: 10
  pos_noise_std: 0.1
  pocket_noise_mode: fixed
  pocket_noise_sigma_coeff: 0.05
  pocket_noise_max: 0.3
  max_grad_norm: 8.0
  optimizer:
    type: adam
    lr: 0.0001
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6
